<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кафе «Затишок» — Меню та замовлення</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--accent:#c2452d;--accent2:#2e7d4f;--text:#2b2320;--muted:#8a7f78;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);min-height:100vh;}
  .header{padding:28px 20px 16px;text-align:center;}
  .logo{font-size:30px;font-weight:800;}
  .logo span{color:var(--accent);}
  .tagline{color:var(--muted);font-size:13px;margin-top:6px;}
  .section{padding:20px;}
  .section h2{font-size:18px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .emoji{font-size:34px;}
  .name{font-weight:700;font-size:15px;}
  .desc{color:var(--muted);font-size:12px;flex:1;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
  .price{font-weight:700;color:var(--accent);}
  .btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn:active{transform:scale(.95);}
  .btn.added{background:var(--accent2);}
  .cart-bar{position:sticky;bottom:14px;margin:0 20px;background:var(--accent);border-radius:14px;padding:14px 18px;display:none;justify-content:space-between;font-weight:700;color:#fff;cursor:pointer;}
  .form{display:none;}
  .form.open{display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input,.field textarea{width:100%;background:#f5f1ec;border:1px solid #e3d9cf;border-radius:10px;padding:12px;font-size:15px;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .order-item{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:10px 0;border-top:1px solid #e3d9cf;padding-top:10px;}
  .pay-options{display:flex;gap:10px;margin-bottom:12px;}
  .pay-opt{flex:1;text-align:center;padding:14px;border:2px solid #e3d9cf;border-radius:12px;cursor:pointer;font-weight:600;background:#fff;}
  .pay-opt .pe{font-size:24px;display:block;margin-bottom:4px;}
  .pay-opt.active{border-color:var(--accent);background:#fdf0ed;color:var(--accent);}
  .submit{width:100%;background:var(--accent);color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;}
  .success{display:none;text-align:center;padding:60px 20px;}
  .success.show{display:block;}
  .success .big{font-size:56px;}
  .success h3{margin:16px 0 8px;font-size:22px;color:var(--accent2);}
  .success p{color:var(--muted);font-size:14px;line-height:1.7;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto;}.section{max-width:760px;margin:0 auto;}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Кафе <span>«Затишок»</span></div>
  <div class="tagline">Смачно, швидко, з любов'ю 💛</div>
</div>

<div class="section" id="menu-section">
  <h2>🍽 Меню</h2>
  <div class="grid" id="menu"></div>
</div>

<div class="section form" id="order-form">
  <h2>📋 Ваше замовлення</h2>
  <div id="order-list"></div>
  <div class="total"><span>Разом</span><span id="total">0 ₴</span></div>

  <div class="field"><label>Спосіб оплати</label>
    <div class="pay-options" id="pay-options">
      <div class="pay-opt active" data-pay="cash"><span class="pe">💵</span>Готівка</div>
      <div class="pay-opt" data-pay="card"><span class="pe">💳</span>Картка</div>
    </div>
  </div>

  <form id="form">
    <div class="field"><label>Ім'я</label><input id="name" placeholder="Як до вас звертатися" required></div>
    <div class="field"><label>Номер столика</label><input id="table" type="number" min="1" placeholder="Напр. 5" required></div>
    <div class="field"><label>Коментар</label><textarea id="comment" rows="2" placeholder="Побажання..."></textarea></div>
    <button class="submit" type="submit" id="submit-btn">Оформити замовлення</button>
  </form>
</div>

<div class="success" id="success">
  <div class="big">✅</div>
  <h3>Замовлення оформлено!</h3>
  <p>Зачекайте, будь ласка, <b>5–10 хвилин</b> — до вас підійде офіціант<br>для оплати <span id="pay-text">готівкою</span>.<br><br>
  <b>№ замовлення: <span id="order-num"></span></b><br>Смачного! 🍽</p>
</div>

<div class="cart-bar" id="cart-bar"><span id="cart-text">Кошик</span><span>Оформити →</span></div>

<script>
const DB_URL = "https://nfcaurotag-default-rtdb.europe-west1.firebasedatabase.app/orders.json";

const MENU = [
  {id:1, emoji:"🍝", name:"Паста карбонара", price:420},
  {id:2, emoji:"🥗", name:"Цезар із куркою", price:380},
  {id:3, emoji:"🍕", name:"Піца «Маргарита»", price:490},
  {id:4, emoji:"🍔", name:"Бургер «Затишок»", price:450},
  {id:5, emoji:"🍣", name:"Суші-сет «Філадельфія»", price:520},
  {id:6, emoji:"🍱", name:"Суші-сет «Дракон»", price:610},
  {id:7, emoji:"🍰", name:"Чізкейк", price:290},
  {id:8, emoji:"☕", name:"Лате", price:240},
];
const cart = {};
let payMethod = 'cash';
const fmt = n => n.toLocaleString('uk-UA') + ' ₴';

const menuEl = document.getElementById('menu');
MENU.forEach(item => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="emoji">${item.emoji}</div>
    <div class="name">${item.name}</div>
    <div class="row">
      <span class="price">${fmt(item.price)}</span>
      <button class="btn" data-id="${item.id}">+ Додати</button>
    </div>`;
  menuEl.appendChild(card);
});

function refresh(){
  const entries = Object.entries(cart);
  const bar = document.getElementById('cart-bar');
  if(entries.length){
    const count = entries.reduce((s,[,q]) => s+q, 0);
    const sum = entries.reduce((s,[id,q]) => s + MENU.find(m=>m.id==id).price*q, 0);
    bar.style.display = 'flex';
    document.getElementById('cart-text').textContent = `Кошик: ${count} · ${fmt(sum)}`;
  } else bar.style.display = 'none';
}

menuEl.addEventListener('click', e => {
  const btn = e.target.closest('.btn'); if(!btn) return;
  const id = +btn.dataset.id;
  cart[id] = (cart[id]||0) + 1;
  btn.textContent = '✓ ' + cart[id];
  btn.classList.add('added');
  setTimeout(()=>{btn.textContent='+ Додати'; btn.classList.remove('added');}, 700);
  refresh();
});

document.getElementById('cart-bar').addEventListener('click', () => {
  const list = document.getElementById('order-list');
  list.innerHTML = '';
  let sum = 0;
  Object.entries(cart).forEach(([id,q]) => {
    const m = MENU.find(x=>x.id==id); sum += m.price*q;
    list.innerHTML += `<div class="order-item"><span>${m.emoji} ${m.name} × ${q}</span><span>${fmt(m.price*q)}</span></div>`;
  });
  document.getElementById('total').textContent = fmt(sum);
  document.getElementById('order-form').classList.add('open');
  document.getElementById('order-form').scrollIntoView({behavior:'smooth'});
});

document.getElementById('pay-options').addEventListener('click', e => {
  const opt = e.target.closest('.pay-opt'); if(!opt) return;
  document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('active'));
  opt.classList.add('active');
  payMethod = opt.dataset.pay;
});

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Відправляємо...'; btn.disabled = true;

  const items = Object.entries(cart).map(([id,q]) => {
    const m = MENU.find(x=>x.id==id);
    return {name: m.name, qty: q, price: m.price};
  });
  const sum = items.reduce((s,i) => s + i.price*i.qty, 0);
  const num = 'Z-' + Math.floor(1000 + Math.random()*9000);

  fetch(DB_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      num, items, sum,
      name: document.getElementById('name').value,
      table: document.getElementById('table').value,
      comment: document.getElementById('comment').value,
      pay: payMethod,
      time: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'}),
      status: 'new'
    })
  }).then(() => {
    document.getElementById('pay-text').textContent = payMethod === 'cash' ? 'готівкою' : 'карткою';
    document.getElementById('order-num').textContent = num;
    document.getElementById('order-form').classList.remove('open');
    document.getElementById('menu-section').style.display = 'none';
    document.getElementById('cart-bar').style.display = 'none';
    document.getElementById('success').classList.add('show');
    window.scrollTo({top:0, behavior:'smooth'});
  }).catch(() => { btn.textContent = 'Помилка — спробуйте ще'; btn.disabled = false; });
});
</script>
</body>
</html>
